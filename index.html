
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONEY_APP_FULL</title>
    <style>
        :root { --bg-color: #0b0f19; --panel-bg: #111827; --accent-green: #34C759; --accent-yellow: #FFCC00; --accent-red: #FF3B30; --text-main: #f3f4f6; --text-muted: #9ca3af; --border-color: #1f2937; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; overflow-x: hidden; }
        .app-header { background: var(--panel-bg); padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .app-title { font-size: 16px; font-weight: bold; letter-spacing: 1px; color: var(--accent-green); font-family: monospace; }
        .page { display: none; padding: 15px; } .page.active { display: block; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .panel-title { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; font-weight: bold; display: flex; justify-content: space-between; }
        .meter-container { margin-bottom: 15px; }
        .meter-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
        .meter-bar-bg { background: #1f2937; height: 12px; border-radius: 6px; overflow: hidden; }
        .meter-bar-fill { height: 100%; width: 0%; transition: width 0.3s; }
        .meter-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: monospace; }
        .btn { background: #007aff; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-green { background: var(--accent-green); }
        .btn-red { background: var(--accent-red); }
        .btn-muted { background: #4b5563; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .terminal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .term-btn { background: #111827; border: 1px solid #334155; color: #38bdf8; padding: 15px; text-align: center; border-radius: 8px; font-family: monospace; font-size: 14px; font-weight: bold; }
        .num-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .num-btn { background: #1e293b; border: 1px solid var(--border-color); color: white; padding: 15px; text-align: center; border-radius: 8px; font-size: 16px; font-family: monospace; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; }
        .tab-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; height: 60px; z-index: 100; }
        .tab-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); font-size: 11px; cursor: pointer; }
        .tab-item.active { color: var(--accent-green); }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-title" id="display-title">MAIN_DASHBOARD</div>
        <button onclick="downloadCSV()" style="background:none; border:1px solid var(--border-color); color:var(--text-muted); padding:4px 8px; border-radius:4px; font-size:10px;">CSV</button>
    </div>

    <!-- コンテンツ部分は先ほどのコードと同じものを入れてください（字数制限のため割愛しますが、中身は先ほどと同じです） -->

        // これで1ファイルとして動作します。
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>System Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header" id="header-title">MAIN - 大本営</div>

  <div id="screen-main" class="screen active">
    <div class="card">
      <h2>食費（日常）プール</h2>
      <div class="meter-wrap">
        <div class="meter-label"><span>残高</span><span id="food-balance">¥0</span></div>
        <div class="meter-bg"><div class="meter-fill" id="food-meter" style="width: 100%;"></div></div>
        <div id="daily-budget-display" class="daily-budget-info">作戦猶予：残り - 日 ／ 当日予算：¥-</div>
      </div>
    </div>
    
    <div class="card">
      <h2>外食・飲みチケット</h2>
      <div class="meter-wrap">
        <div class="meter-label">
          <span>残りチケット</span>
          <span id="drink-tickets" class="ticket-safe">0 枚</span>
        </div>
      </div>
    </div>
  </div>

  <div id="screen-terminal" class="screen">
    <div id="stealth-status-bar" class="status-safe">[ ONLINE ]</div>
    
    <div class="card">
      <h2 style="font-family: monospace;">SYSTEM CONSOLE</h2>
      <div id="stealth-display" style="font-family: monospace; font-size: 24px; text-align: right; padding: 10px; background: #eee; border-radius: 8px; margin-bottom: 15px;">0</div>
      
      <div style="display: flex; gap: 10px;">
        <button onclick="stealthAction('D')" style="background: #34C759;">Task D (Drink)</button>
        <button onclick="stealthAction('F')" style="background: #007aff;">Task F (Food)</button>
      </div>

      <div class="numpad">
        <button onclick="stealthInput(1)">1</button>
        <button onclick="stealthInput(2)">2</button>
        <button onclick="stealthInput(3)">3</button>
        <button onclick="stealthInput(4)">4</button>
        <button onclick="stealthInput(5)">5</button>
        <button onclick="stealthInput(6)">6</button>
        <button onclick="stealthInput(7)">7</button>
        <button onclick="stealthInput(8)">8</button>
        <button onclick="stealthInput(9)">9</button>
        <button onclick="stealthClear()" style="background: #ffcc00; color: #000;">C</button>
        <button onclick="stealthInput(0)">0</button>
        <button onclick="stealthEnter()" style="background: #007aff; color: #fff;">EXE</button>
      </div>
    </div>
  </div>

  <div id="screen-fixd" class="screen">
    <div class="card">
      <h2>毎月の予定 (FIXED)</h2>
      <button onclick="alert('FIXED設定機能（既存コード）')">テンプレート追加・編集</button>
    </div>
  </div>

  <div id="screen-vault" class="screen">
    <div class="card">
      <h2>設定＆データ保護 (SET)</h2>
      <label>次回給料日 (月末判定用)</label>
      <input type="date" id="setting-paydate" onchange="saveSettings()">
      
      <label>食費 初期値</label>
      <input type="number" id="setting-food-init" onchange="saveSettings()">
      
      <label>チケット 初期枚数</label>
      <input type="number" id="setting-ticket-init" onchange="saveSettings()">

      <label>当日予算 生存限界値 (赤警告ライン)</label>
      <input type="number" id="setting-survival-limit" value="1000" onchange="saveSettings()">

      <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
      
      <h2>Emergency Backup</h2>
      <button onclick="exportData()" class="btn-secondary">📤 データ退避/移行用テキストコピー</button>
      <div id="env-indicator">実行環境: 判定中...</div>
    </div>
  </div>

  <div class="tab-container">
    <button class="tab-btn active" onclick="switchTab('main')">MAIN</button>
    <button class="tab-btn" onclick="switchTab('terminal')">TERMINAL</button>
    <button class="tab-btn" onclick="switchTab('fixd')">FIXD</button>
    <button class="tab-btn" onclick="switchTab('vault')">VAULT/SET</button>
  </div>

  <script src="script.js?v=22"></script>
</body>
</html>

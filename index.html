<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAIN_DASHBOARD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-title">MAIN_DASHBOARD</div>
        <div class="header-status"><span class="dot"></span> LIVE_LINK</div>
    </div>

    <div class="page active" id="page-main">
        <div class="title-area">
            <h2>現在の実績</h2>
            <button class="edit-btn" onclick="showCycleEditModal()">✏️ 最終日変更</button>
        </div>

        <div class="card balance-card">
            <div class="label">自由に使える残高 (Balance)</div>
            <div class="amount" id="total">0円</div>
        </div>

        <div class="budget-row">
            <div class="budget-box">
                <div class="label">今日の予算</div>
                <div class="amount" id="todayBudget">0円</div>
            </div>
            <div class="divider"></div>
            <div class="budget-box">
                <div class="label">今週の予算</div>
                <div class="amount" id="weekRemaining">0円</div>
            </div>
        </div>

        <div class="card metrics-card">
            <div class="metrics-title">SYS_RESOURCE_METRICS</div>
            
            <div class="metric-row">
                <div class="metric-labels"><span>[DAY] <span id="amt-day">0円</span></span> <span id="val-day">100%</span></div>
                <div class="progress-bg"><div class="progress-fill" id="bar-day"></div></div>
            </div>
            
            <div class="metric-row">
                <div class="metric-labels"><span>[WEEK] <span id="amt-week">0円</span></span> <span id="val-week">100%</span></div>
                <div class="progress-bg"><div class="progress-fill" id="bar-week"></div></div>
            </div>

            <div class="metric-row">
                <div class="metric-labels"><span>[CORE] <span id="amt-core">0円</span></span> <span id="val-core">100%</span></div>
                <div class="progress-bg"><div class="progress-fill" id="bar-core"></div></div>
            </div>
        </div>

        <div class="card manual-record">
            <div class="label" style="margin-bottom: 12px; font-size: 12px; color: #8e8e93; font-weight: bold;">手動記録</div>
            <div class="input-row">
                <input type="date" id="date">
                <input type="time" id="time" value="12:00">
            </div>
            <input type="number" id="amount" placeholder="金額" inputmode="numeric">
            <select id="type" style="color: #007aff;">
                <option value="expense">支出</option>
                <option value="income">収入</option>
            </select>
            <input type="text" id="category" placeholder="カテゴリ">
            <button class="record-btn" onclick="addData()">データを記録</button>
        </div>
        
        <div class="card list-card">
            <div class="label" style="margin-bottom: 12px; font-size: 12px; color: #8e8e93; font-weight: bold;">履歴・予定</div>
            <div id="list"></div>
        </div>
    </div>

    <div class="page" id="page-terminal">
        <div class="card"><p style="text-align:center; color:#8e8e93;">TERMINAL機能は現在非表示です</p></div>
    </div>

    <div class="page" id="page-template">
        <div class="card"><p style="text-align:center; color:#8e8e93;">FIXED機能は現在非表示です</p></div>
    </div>

    <div id="cycle-edit-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px; font-size:16px;">最終日変更</h3>
            <input type="hidden" id="cycle-edit-key">
            <input type="date" id="cycle-edit-date" style="margin-bottom: 15px;">
            <div style="display:flex; gap:10px;">
                <button class="btn btn-muted" onclick="closeCycleEditModal()">閉じる</button>
                <button class="btn btn-blue" onclick="saveCycleEnd()">保存</button>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchPage('main', this)">
            <span class="icon">📊</span><br>MAIN
        </div>
        <div class="tab" onclick="switchPage('terminal', this)">
            <span class="icon">🛰️</span><br>TERMINAL
        </div>
        <div class="tab" onclick="switchPage('template', this)">
            <span class="icon">📆</span><br>FIXED
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>

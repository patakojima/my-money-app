<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integrated Ops Terminal</title>
<style>
/* 共通設定 */
* { box-sizing: border-box; }
:root {
  --primary: #007aff;
  --drink: #FF9500;
  --food: #34C759;
  --bg: #f0f2f5;
  --card: #ffffff;
}
body { 
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
  background: var(--bg); 
  margin: 0;
  color: #333;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ヘッダー */
.header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
.sys-title { font-weight: 800; font-size: 11px; color: var(--primary); letter-spacing: 2px; }
.status-dot { width: 7px; height: 7px; background: #34C759; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1.2s infinite; }
@keyframes blink { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

/* コンテンツエリア */
.content { flex: 1; overflow-y: auto; padding: 0 16px 100px; }
.page { display: none; }
.page.active { display: block; }

/* 共通カード */
.card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

/* --- 以前の家計簿用スタイル --- */
h2 { text-align: center; margin: 10px 0 20px; font-size: 1.2rem; }
input, select, .main-btn { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; border-radius: 8px; border: 1px solid #ddd; -webkit-appearance: none; }
.main-btn { background: #007aff; color: white; border: none; font-weight: bold; }
.income { color: #28a745; font-weight: bold; }
.expense { color: #dc3545; font-weight: bold; }
.item { padding: 12px 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.total-box { text-align: center; }
.total-amount { font-size: 22px; font-weight: bold; margin: 4px 0; }
.budget-info { display: flex; justify-content: space-around; text-align: center; font-size: 13px; }
.budget-val { display: block; font-size: 16px; font-weight: bold; margin-top: 4px; }

/* --- 宴会モック用スタイル --- */
.mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
.mode-btn { border: 2px solid #efeff4; background: #fbfbfd; padding: 22px 0; border-radius: 15px; color: #8e8e93; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.mode-btn b { font-size: 22px; margin-bottom: 2px; }
.mode-btn span { font-size: 8px; font-weight: 300; font-family: monospace; }
.mode-btn.active-d { border-color: var(--drink); color: var(--drink); background: #FFF9F2; }
.mode-btn.active-f { border-color: var(--food); color: var(--food); background: #F2FFF5; }
.num-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.num-btn { background: #f2f2f7; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700; }
.log-msg { font-size: 9px; font-weight: 200; color: #aeaeb2; text-align: center; margin-top: 15px; font-family: monospace; }

/* タブバー */
.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #d1d1d6; padding: 10px 0 34px; }
.tab-item { flex: 1; text-align: center; color: #8e8e93; border: none; background: none; font-size: 10px; font-weight: bold; }
.tab-item.active { color: var(--primary); }
</style>
</head>
<body>

<div class="header">
    <div class="sys-title" id="display-title">MAIN_APP_V1.0</div>
    <div><span class="status-dot"></span><small style="font-size:9px; font-weight:bold; color:#8e8e93;">SECURE_MODE</small></div>
</div>

<div class="content">
  <div id="page-main" class="page active">
    <h2>入出金管理</h2>
    <div class="card">
      <input type="date" id="date">
      <input type="number" id="amount" placeholder="金額" inputmode="numeric">
      <select id="type">
        <option value="expense">支出</option>
        <option value="income">収入</option>
      </select>
      <input type="text" id="category" placeholder="カテゴリ（食費など）">
      <input type="text" id="memo" placeholder="メモ">
      <button class="main-btn" onclick="addData()">データ追加</button>
    </div>

    <div class="card total-box">
      <div style="font-size:14px; color:#666;">現在の残高</div>
      <div class="total-amount" id="total">0円</div>
      <div id="alert" style="font-size:14px; font-weight:bold; margin-top:10px;"></div>
    </div>

    <div class="card budget-info">
      <div>今日の予算<span class="budget-val" id="todayBudget">0円</span></div>
      <div style="border-left: 1px solid #eee;"></div>
      <div>今週あと使える<span class="budget-val" id="weekRemaining">0円</span></div>
    </div>

    <div class="card" id="list"></div>
  </div>

  <div id="page-terminal" class="page">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
        <div class="card">
            <div style="font-size:9px; color:#8e8e93; font-weight:bold;">UNIT_D (DRINK)</div>
            <div id="mock-d-count" style="font-size:24px; font-weight:800;">0</div><span style="font-size:10px; color:#aeaeb2;">杯</span>
        </div>
        <div class="card">
            <div style="font-size:9px; color:#8e8e93; font-weight:bold;">UNIT_F (FOOD)</div>
            <div id="mock-f-count" style="font-size:24px; font-weight:800;">0</div><span style="font-size:10px; color:#aeaeb2;">品</span>
        </div>
    </div>
    <div class="card" style="padding: 20px;">
        <div class="mode-selector">
            <button id="btn-mode-d" class="mode-btn active-d" onclick="setMode('D')"><b>D</b><span>DRINK_MODE</span></button>
            <button id="btn-mode-f" class="mode-btn" onclick="setMode('F')"><b>F</b><span>FOOD_MODE</span></button>
        </div>
        <div class="num-grid">
            <button class="num-btn" onclick="mockCommit(3)">③</button>
            <button class="num-btn" onclick="mockCommit(4)">④</button>
            <button class="num-btn" onclick="mockCommit(5)">⑤</button>
            <button class="num-btn" onclick="mockCommit(6)">⑥</button>
            <button class="num-btn" onclick="mockCommit(7)">⑦</button>
            <button class="num-btn" onclick="mockCommit(8)">⑧</button>
            <button class="num-btn" onclick="mockCommit(9)">⑨</button>
            <button class="num-btn" onclick="mockCommit(10)">⑩</button>
            <button class="num-btn" onclick="mockCommit(11)">⑪</button>
        </div>
        <div id="log-msg" class="log-msg">STATUS: STANDBY<br>AWAITING INPUT...</div>
    </div>
  </div>
</div>

<nav class="tab-bar">
    <button class="tab-item active" onclick="switchPage('main', this)">📊 MAIN</button>
    <button class="tab-item" onclick="switchPage('terminal', this)">🛰️ TERMINAL</button>
</nav>

<script>
// --- ページ切替ロジック ---
function switchPage(pageId, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('display-title').innerText = pageId === 'main' ? 'MAIN_APP_V1.0' : 'TERMINAL_OP_V2.3';
}

// --- 以前の家計簿ロジック (localStorage) ---
let data = JSON.parse(localStorage.getItem("moneyData")) || [];

window.onload = () => {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  document.getElementById("date").value = `${y}-${m}-${d}`;
  render();
};

function save() {
  localStorage.setItem("moneyData", JSON.stringify(data));
}

function addData() {
  const amountEl = document.getElementById("amount");
  const dateEl = document.getElementById("date");
  if (!amountEl.value) return alert("金額を入力してください");

  const item = {
    date: dateEl.value,
    amount: Number(amountEl.value),
    type: document.getElementById("type").value,
    category: document.getElementById("category").value,
    memo: document.getElementById("memo").value
  };

  data.push(item);
  save();
  render();

  amountEl.value = "";
  document.getElementById("memo").value = "";
  document.getElementById("category").value = "";
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  let totalIncome = 0, totalExpense = 0, weekExpense = 0;
  const today = new Date();
  const dayOfWeek = today.getDay(); 
  const startOfWeek = new Date(today);
  startOfWeek.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
  startOfWeek.setHours(0, 0, 0, 0);
  const endOfWeek = new Date(startOfWeek);
  endOfWeek.setDate(startOfWeek.getDate() + 6);
  endOfWeek.setHours(23, 59, 59, 999);

  data.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(d => {
      const dDate = new Date(d.date);
      const div = document.createElement("div");
      div.className = "item " + d.type;
      const sign = d.type === 'expense' ? '-' : '+';
      div.innerHTML = `<div><small style="color:#999; display:block;">${d.date}</small>${d.category || '未分類'} <small style="color:#666;">${d.memo ? '('+d.memo+')' : ''}</small></div><div>${sign}${d.amount.toLocaleString()}円</div>`;
      list.appendChild(div);
      if (d.type === "income") totalIncome += d.amount;
      if (d.type === "expense") {
        totalExpense += d.amount;
        if (dDate >= startOfWeek && dDate <= endOfWeek) weekExpense += d.amount;
      }
  });

  const total = totalIncome - totalExpense;
  document.getElementById("total").innerText = total.toLocaleString() + "円";
  const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0); 
  const remainingDaysInMonth = Math.max(1, lastDay.getDate() - today.getDate() + 1);
  const todayBudget = Math.floor(total / remainingDaysInMonth);
  const weekBudget = todayBudget * 7;
  const weekRemaining = weekBudget - weekExpense;

  document.getElementById("todayBudget").innerText = (todayBudget > 0 ? todayBudget.toLocaleString() : 0) + "円";
  document.getElementById("weekRemaining").innerText = weekRemaining.toLocaleString() + "円";

  const alertEl = document.getElementById("alert");
  if (total < 0) { alertEl.innerText = "⚠️ 残高がマイナスです"; alertEl.style.color = "#dc3545"; }
  else if (weekRemaining < 0) { alertEl.innerText = "⚠️ 今週の予算を超えています"; alertEl.style.color = "#dc3545"; }
  else { alertEl.innerText = "✅ 順調なペースです"; alertEl.style.color = "#28a745"; }
}

// --- 宴会モックロジック ---
let mMode = 'D', mDCount = 0, mFCount = 0;
function setMode(mode) {
    mMode = mode;
    document.getElementById('btn-mode-d').className = mode === 'D' ? 'mode-btn active-d' : 'mode-btn';
    document.getElementById('btn-mode-f').className = mode === 'F' ? 'mode-btn active-f' : 'mode-btn';
}
function mockCommit(val) {
    if(mMode === 'D') mDCount++; else mFCount++;
    document.getElementById('mock-d-count').innerText = mDCount;
    document.getElementById('mock-f-count').innerText = mFCount;
    const msg = document.getElementById('log-msg');
    msg.innerHTML = `ENTRY_SUCCESS: ${mMode}+${val}00<br>ENCRYPTING & UPLOADING...`;
    msg.style.color = mMode === 'D' ? '#FF9500' : '#34C759';
    setTimeout(() => { msg.style.color = '#aeaeb2'; msg.innerHTML = "SYSTEM: STANDBY<br>AWAITING INPUT..."; }, 1500);
}
</script>
</body>
</html>

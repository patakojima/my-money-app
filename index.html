<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Management Tool</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; }
        .header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: #262626; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 20px; font-weight: bold; margin-top: 5px; }
        
        /* 秘密の入力ボタン */
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        button { 
            background: #333; color: white; border: none; padding: 15px 0; 
            border-radius: 5px; font-size: 14px; font-weight: bold;
            active { background: #444; }
        }
        .btn-d { border-bottom: 3px solid #3498db; } /* Drink */
        .btn-f { border-bottom: 3px solid #2ecc71; } /* Food */
        
        .reset-btn { margin-top: 30px; background: none; color: #555; font-size: 10px; width: 100%; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="label">System Operation Status</div>
            <div style="font-size: 12px; color: #2ecc71;">● Online / Secure Mode</div>
        </div>

        <div class="status-grid">
            <div class="card">
                <div class="label">ALC Log (D)</div>
                <div id="d-count" class="value">00</div>
            </div>
            <div class="card">
                <div class="label">Food Log (F)</div>
                <div id="f-count" class="value">00</div>
            </div>
            <div class="card" style="grid-column: span 2;">
                <div class="label">Current Expense (Unit)</div>
                <div id="total-unit" class="value">0.0</div>
            </div>
        </div>

        <div class="label" style="margin-bottom: 10px;">Input Terminal</div>
        <div class="btn-grid">
            <button class="btn-d" onclick="add('D', 3)">D+③</button>
            <button class="btn-d" onclick="add('D', 5)">D+⑤</button>
            <button class="btn-d" onclick="add('D', 7)">D+⑦</button>
            <button class="btn-f" onclick="add('F', 5)">F+⑤</button>
            <button class="btn-f" onclick="add('F', 10)">F+⑩</button>
            <button class="btn-f" onclick="add('F', 15)">F+⑮</button>
        </div>

        <button class="reset-btn" onclick="resetLogs()">SYSTEM RESET</button>
    </div>

    <script>
        let dCount = 0;
        let fCount = 0;
        let total = 0;

        function add(type, val) {
            if(type === 'D') dCount++;
            if(type === 'F') fCount++;
            total += (val * 100);
            update();
        }

        function update() {
            document.getElementById('d-count').innerText = dCount.toString().padStart(2, '0');
            document.getElementById('f-count').innerText = fCount.toString().padStart(2, '0');
            document.getElementById('total-unit').innerText = (total / 1000).toFixed(1) + "k";
        }

        function resetLogs() {
            if(confirm("ログをクリアしますか？")) {
                dCount = 0; fCount = 0; total = 0; update();
            }
        }
    </script>
</body>
</html>
